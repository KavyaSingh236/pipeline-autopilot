services:
  - type: web
    name: pipeline-autopilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      - key: TICK_SECONDS
        value: "30"
      - key: INITIAL_DELAY_SECONDS
        value: "5"
      - key: FAILURE_CHANCE
        value: "0.6"
      - key: PYTHON_VERSION
        value: 3.11.9
